<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Архитектура DownloadLib</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(760px,100% - 32px);margin:64px auto 96px}
</style></head><body class="iso" data-theme="dark"><main class="iso-page"><style>.ar-stage{position:relative;touch-action:pan-y;outline:none}
.ar-stage:focus-visible{outline:1px solid var(--anatomy-muted);outline-offset:6px}
.ar-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.iso-plate .iso-plate-corner[data-corner="readout"]{max-width:62%;overflow:hidden;text-overflow:ellipsis}

.ar-window{fill:var(--anatomy-shade-0);stroke:var(--anatomy-lo);stroke-width:.4px;vector-effect:non-scaling-stroke}
.ar-digits{fill:var(--anatomy-hi);font-family:var(--anatomy-mono);font-variant-numeric:tabular-nums}
.ar-hole{fill:var(--anatomy-shade-0);stroke:var(--anatomy-lo);stroke-width:.4px;vector-effect:non-scaling-stroke}
.ar-dialface{fill:var(--anatomy-top);stroke:var(--anatomy-mid);stroke-width:.5px;vector-effect:non-scaling-stroke}
.ar-ring{fill:none;stroke:var(--anatomy-faint);stroke-width:.5px;vector-effect:non-scaling-stroke}
.ar-hub{fill:var(--anatomy-top);stroke:var(--anatomy-hi);stroke-width:.6px;vector-effect:non-scaling-stroke}
.ar-pin{fill:var(--anatomy-hi)}
.ar-key{fill:var(--anatomy-shade-2);stroke:var(--anatomy-mid);stroke-width:.5px;vector-effect:non-scaling-stroke}

.ar-lamp[data-lit] .iso-top{fill:var(--anatomy-lit-top)}
.ar-lamp[data-lit] .iso-shade{fill:var(--anatomy-lit-shade)}
.ar-lamp[data-lit] .iso-edge{stroke:var(--anatomy-lit)}
.ar-keyitem[data-lit] .ar-key{fill:var(--anatomy-lit-shade);stroke:var(--anatomy-lit)}

.iso{--ar-hot-body:#8c8c8c;--ar-hot-shine:#e4e4e4;--ar-hot-shade:#5c5c5c}
.iso[data-theme="light"]{--ar-hot-body:#6a6a70;--ar-hot-shine:#a6a6ac;--ar-hot-shade:#3a3a3e}
.it[data-hot] .tb-body{fill:var(--ar-hot-body)}
.it[data-hot] .tb-shine{fill:var(--ar-hot-shine)}
.it[data-hot] .tb-shade{fill:var(--ar-hot-shade)}
.it[data-hot] .iso-edge{stroke:var(--anatomy-lit)}

.ar-stage[data-focus] .it:not([data-on]){--anatomy-hi:var(--anatomy-mid);--anatomy-mid:var(--anatomy-lo)}
.ar-stage[data-focus] .it:not([data-on]) .ar-digits{fill:var(--anatomy-mid)}
.it[data-on]{--anatomy-hi:var(--anatomy-lit);--anatomy-mid:var(--anatomy-hi)}
.it[data-on] .iso-top,.it[data-on] .tb-shine{fill:var(--anatomy-lit-top)}
.it[data-on] .iso-shade,.it[data-on] .tb-body{fill:var(--anatomy-lit-shade)}

.ar-parts{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.ar-part{display:inline-flex;align-items:baseline;gap:7px;padding:5px 10px;border:0;border-radius:999px;background:transparent;color:var(--anatomy-muted);font:12.5px/1.3 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;cursor:pointer;box-shadow:inset 0 0 0 1px var(--anatomy-faint);transition:color .16s var(--anatomy-ease),background .16s var(--anatomy-ease)}
.ar-part:hover,.ar-part:focus-visible,.ar-part[data-on]{color:var(--anatomy-strong);background:var(--anatomy-face);outline:none;box-shadow:inset 0 0 0 1px var(--anatomy-mid)}
.ar-num{font-family:var(--anatomy-mono);font-size:10px;color:var(--anatomy-muted)}

@media (max-width:560px){
  .iso-plate{padding:44px 0 70px;overflow:hidden}
  .ar-stage>svg{width:108%;margin:0 -5% 0 -3%}
  .iso-plate .iso-plate-corner[data-corner="readout"]{bottom:0;left:0;right:auto;max-width:100%}
}
@media (prefers-reduced-motion:reduce){.ar-part{transition:none}}

const rodSvg = (drop) => solidSvg(cylinder(158, -20, 2.4, D.platen.z1 - drop, 82 - D.platen.z1 + drop, P, 20), { tone: "hi", crease: "none" });

let history = 0;
let lastLoop = -1;
let lastNeedle = -1;
let lastRod = -1;
let mbShown = 0;
let tourFocus = null;
let userFocus = null;

function drawTour(tour) {
  const loop = Math.floor(tour / LOOP);
  const t = tour - loop * LOOP;
  if (loop !== lastLoop) {
    lastLoop = loop;
    history = loop;
  }
  const sim = simAt(t);
  const s = sim === null ? null : stateAt(sim);
  const inWindow = drawDial(sim);
  drawRoutes(hotRoutes(t, sim));

  const press = bump((t - 1.4) / 0.5);
  setAttr(el.siteButton, "transform", press ? translateAlong(P, [0, -1.8 * press, 0]) : null);
  flag(el.lamp.site, "data-lit", t >= 1.4);
  flag(el.lamp.sender, "data-lit", t >= 3.0 && t < 4.2);
  flag(el.lamp.ui, "data-lit", t >= 3.9);
  flag(el.lamp.intercept, "data-lit", t >= 5.4 && t < 6.4);
  el.jacks.forEach((g, i) => flag(g, "data-lit", (i === 0 && t >= 1.9 && t < 3.6) || (i === 7 && ((t >= 3.0 && t < 4.3) || (t >= 6.0 && t < 7.4))) || (i === 8 && s && SIM.requests.some((r) => sim - r.ask > 0 && sim - r.ask < 0.5))));
  el.keys.forEach((g, i) => flag(g, "data-lit", i === 0 && t >= 6.0 && t < 7.6));
  setAttr(el.knobService, "d", knobD(D.knobs.service, t >= 4.6 ? 0 : 1));

  const share = rangeShare(t);
  setAttr(el.riderTo, "transform", share > 0 ? riderShift(1, 1 + share * 5) : riderShift(1, D.titleChapters));

  const sockets = new Set();
  if (s) for (const r of s.flight) sockets.add(r.kind === "page" ? r.worker : 0);
  el.sockets.forEach((g, i) => flag(g, "data-lit", sockets.has(i)));
  flag(el.lamp.gate, "data-lit", s && s.waiting);
  flag(el.lamp.wait, "data-lit", s && s.waiting);
  flag(el.sitePad, "data-lit", s && s.flight.length > 0);

  // каретка: листы текущей главы, рейс к весам и обратно
  let shift = 0;
  let sheets = 0;
  if (s) {
    if (s.carry) {
      const u = (sim - s.carry.end) / D.carry;
      shift = u < 1 ? smooth(0, 1, u) : 1 - smooth(1, 2, u);
      sheets = u < 1 ? 8 : 0;
    }
    if (!s.carry || (sim - s.carry.end) / D.carry >= 1) {
      const c = s.chapter >= 0 ? SIM.chapters[s.chapter] : null;
      if (c) sheets = Math.ceil((c.pages.filter((r) => r.done <= sim || (r.deferAt && r.deferAt <= sim)).length / c.pages.length) * 8);
    }
  }
  setAttr(el.carriage, "transform", shift ? translateAlong(P, [shift * D.carTravel, 0, 0]) : null);
  el.sheets.forEach((g, i) => show(g, i < sheets));

  // гильотина: рез на каждую готовую страницу, длинные режутся дважды
  let cut = 0;
  if (s) for (const r of SIM.requests) if (r.kind === "page") {
    const u = (sim - r.done) / 0.3;
    if (u > 0 && u < r.parts) cut = Math.max(cut, bump(u % 1));
  }
  setAttr(el.blade, "transform", cut ? translateAlong(P, [0, 0, -18 * cut]) : null);

  // весы, пресс, лоток
  const onScale = s ? s.onScale.length : 0;
  el.batch.forEach((g, i) => show(g, i < onScale));
  const mb = s ? s.mb : 0;
  mbShown += (mb - mbShown) * 0.18;
  if (Math.abs(mb - mbShown) < 0.2) mbShown = mb;
  if (Math.abs(mbShown - lastNeedle) > 0.05) {
    lastNeedle = mbShown;
    setAttr(el.needle, "d", needleD(mbShown));
  }
  const inPress = s ? SIM.files.find((f) => sim >= f.flushAt && sim < f.savedAt) : null;
  el.stack.forEach((g, i) => show(g, inPress && i < inPress.chapters.length && sim < inPress.exportAt + 1.6));
  let drop = 0;
  if (s && s.exporting) {
    const u = (sim - s.exporting.exportAt) / 1.6;
    const room = D.platen.z0 - (18 + 2.4 * s.exporting.chapters.length);
    drop = Math.min(D.platen.travel, room) * bump(clamp01(u));
  }
  setAttr(el.platen, "transform", drop ? translateAlong(P, [0, 0, -drop]) : null);
  if (Math.abs(drop - lastRod) > 0.01) {
    lastRod = drop;
    el.rod.innerHTML = rodSvg(drop);
  }
  const saved = s ? s.saved : 0;
  el.books.forEach((g, i) => show(g, i < saved));
  text(el.history, String(history + (t >= SIM_AT + SIM_REAL + HOLD ? 1 : 0)).padStart(3, "0"));
  el.cards.forEach((g, i) => show(g, s && i < s.deferred.length));
  el.tries.forEach((g, i) => flag(g, "data-lit", s && i === 0 && s.deferred.length > 0));
  const pct = progressAt(sim);
  text(el.progress, pct === null ? "--- %" : `${String(pct).padStart(3, " ")} %`);

  const phase = sayAt(t, sim, s, inWindow);
  tourFocus = phase.asm;
  return phase;
}

function applyFocus(asm, user) {
  flag(stage, "data-focus", !!user);
  for (const g of items) flag(g, "data-on", asm && g.dataset.asm === asm);
  buttons.forEach((b) => flag(b, "data-on", user && b.dataset.asm === asm));
}

let frame = 0;
let last = 0;
let visible = false;
let touring = !still.matches;
let clock = 0;
let idle = 0;
let shownAsm = null;
let shownUser = false;
let announced = "";

function draw() {
  const phase = drawTour(clock);
  const asm = userFocus ?? phase.asm;
  if (asm !== shownAsm || !!userFocus !== shownUser) {
    shownAsm = asm;
    shownUser = !!userFocus;
    applyFocus(asm, !!userFocus);
  }
  const line = userFocus ? PARTS.find((p) => p.asm === userFocus).say : phase.say;
  text(readout, line);
  if (userFocus && announced !== userFocus) {
    announced = userFocus;
    status.textContent = PARTS.find((p) => p.asm === userFocus).label;
  }
}

function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  if (touring && !userFocus) clock += dt;
  draw();
  const busy = (touring && !userFocus) || Math.abs(mbShown - lastNeedle) > 0.05;
  frame = visible && busy ? requestAnimationFrame(tick) : 0;
}
function run() {
  if (!frame && visible) {
    last = 0;
    frame = requestAnimationFrame(tick);
  }
}
function quiet() {
  clearTimeout(idle);
  idle = setTimeout(() => {
    userFocus = null;
    announced = "";
    if (!still.matches) touring = true;
    draw();
    run();
  }, 3600);
}
function select(asm) {
  userFocus = asm;
  quiet();
  draw();
  run();
}

new IntersectionObserver((entries) => {
  visible = entries[entries.length - 1].isIntersecting;
  if (visible) run();
}, { rootMargin: "120px 0px" }).observe(stage);

svg.addEventListener("pointermove", (event) => {
  const hit = event.target.closest(".it");
  if (hit && hit.dataset.asm && hit.dataset.asm !== "") {
    if (hit.dataset.asm !== userFocus) select(hit.dataset.asm);
    else quiet();
  }
});
svg.addEventListener("pointerleave", () => {
  if (userFocus) quiet();
});
svg.addEventListener("click", (event) => {
  const hit = event.target.closest(".it");
  if (hit && hit.dataset.asm) select(hit.dataset.asm);
});
for (const b of buttons) {
  b.addEventListener("mouseenter", () => select(b.dataset.asm));
  b.addEventListener("focus", () => select(b.dataset.asm));
  b.addEventListener("click", () => select(b.dataset.asm));
}
const ORDER = PARTS.map((p) => p.asm);
stage.addEventListener("keydown", (event) => {
  if (event.metaKey || event.ctrlKey || event.altKey) return;
  if (event.key === "ArrowRight" || event.key === "ArrowLeft") {
    event.preventDefault();
    const here = ORDER.indexOf(userFocus ?? tourFocus);
    const next = (here + (event.key === "ArrowRight" ? 1 : ORDER.length - 1)) % ORDER.length;
    select(ORDER[here < 0 ? 0 : next]);
  } else if (event.key === " " || event.key === "Enter") {
    event.preventDefault();
    userFocus = null;
    touring = !touring;
    clearTimeout(idle);
    draw();
    run();
  } else if (event.key === "Escape") {
    event.preventDefault();
    userFocus = null;
    clearTimeout(idle);
    touring = !still.matches;
    draw();
    run();
  }
});
stage.addEventListener("focus", () => {
  if (!status.textContent) status.textContent = readout.textContent;
});

$$(".it[data-host]").forEach((g) => g.setAttribute("data-lit", ""));
if (still.matches) {
  touring = false;
  clock = SIM_AT + HOLD + simToReal(25);
}
draw();
</script></body></html>
